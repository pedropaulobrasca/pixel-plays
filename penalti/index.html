<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pênalti</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --a: #c43a2e; --b: #2c4e80; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: crosshair; outline: none; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 2px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  .team { display: flex; align-items: center; gap: 8px; }
  .team b { font-size: 16px; font-weight: 600; min-width: 1ch; font-variant-numeric: tabular-nums; }
  .team span.name { color: var(--muted); }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 6px; height: 6px; background: currentColor; opacity: .16; }
  .dots i.g { opacity: 1; }
  .dots i.m { opacity: 1; background: none; box-shadow: inset 0 0 0 1px currentColor; }
  #you { color: var(--a); } #rival { color: var(--b); }
  #status { color: var(--muted); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Disputa de pênaltis. Na sua vez, mire no gol, segure e solte para chutar. Na vez do rival, toque no gol para pular."></canvas></div>
<div id="scores">
  <div class="team" id="you"><b id="s0">0</b><span class="dots" id="d0"></span><span class="name">você</span></div>
  <div class="team" id="rival"><b id="s1">0</b><span class="dots" id="d1"></span><span class="name">rival</span></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false">som ligado</button>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'penalti',
  rules: [
    'Disputa de pênaltis: 5 cobranças para cada lado. Se empatar, segue nas alternadas até alguém errar.',
    'Na sua vez de bater, mire no gol com o mouse ou o dedo. Segure para encher a força e solte para chutar. Força demais manda a bola por cima. Teclado: setas miram, segure espaço.',
    'Na vez do rival você é o goleiro: toque no ponto do gol para onde quer pular. Se pular cedo demais, o batedor troca de canto. Teclado: ← → ↑ ↓.',
    'Dica: o quadril do batedor costuma apontar para o canto do chute.',
  ],
});
</script>
<script>window.PP_SCENE = { originY: 26, shadowX: 1.3, shadowY: -.12 };</script>
<script src="../engine.js"></script>
<script>
'use strict';

/* ---------- pitch coordinates ----------
   a runs screen-right, b runs towards the camera, so the goal faces the viewer.
   The engine works in x/y; toXY converts. */
const toXY = (a, b) => [(a + b) / R2, (b - a) / R2];
const W3 = (a, b, z) => { const [x, y] = toXY(a, b); return [x, y, z]; };
const P3 = (a, b, z) => { const [x, y] = toXY(a, b); return project(x, y, z); };

const GB = -9, GW = 10, GH = 3.3, ND = 1.9, BH = GH * .78, POST_R = .11;
const SPOT_B = 2, BR = .21, GRAV = 12, KEEPER_B = GB + .45;
const BOARD_B = -12.3, BOARD_H = .85, BOARD_A = 12.8;
const RUN_T = .62, KICK_T = .26, CONTACT = .66, PLANT = [-.3, 2.5], RUN_FROM = [-2.6, 5.7];
const BOT_DIVE = .5, PLAYER_DIVE = .34;

const YOU = { shirt: [196, 58, 46], stripe: [238, 230, 212], shorts: [242, 238, 228], socks: [196, 58, 46], skin: [222, 170, 132], hair: [38, 28, 24] };
const RIVAL = { shirt: [44, 80, 132], stripe: [44, 80, 132], shorts: [30, 40, 66], socks: [236, 236, 230], skin: [176, 122, 88], hair: [26, 22, 20] };
const KEEP_YOU = { shirt: [72, 152, 88], stripe: [72, 152, 88], shorts: [34, 40, 40], socks: [72, 152, 88], skin: [204, 152, 112], hair: [92, 64, 40], gloves: [240, 240, 232] };
const KEEP_RIVAL = { shirt: [238, 180, 46], stripe: [238, 180, 46], shorts: [40, 36, 34], socks: [238, 180, 46], skin: [230, 184, 146], hair: [180, 140, 80], gloves: [240, 240, 232] };
const MATES = [
  { ...YOU, skin: [190, 134, 98], hair: [30, 24, 20] },
  { ...YOU, skin: [232, 190, 152], hair: [150, 100, 52] },
  { ...RIVAL, skin: [222, 170, 132], hair: [60, 44, 30] },
  { ...RIVAL, skin: [120, 82, 60], hair: [20, 18, 16] },
];
const BOOT = [34, 32, 30], POST_C = [244, 242, 234], FRAME_C = [150, 152, 150], BALL_C = [240, 238, 230];
const BALL_INK = rgb(40, 38, 36), NET_BACK = rgb(214, 216, 210), NET_FRONT = rgb(234, 234, 226), RED = rgb(222, 60, 40);

/* ---------- ground ---------- */
const KIND_PITCH = 1, KIND_LINE = 2, KIND_DIRT = 4;
const PITCH = [[56, 96, 50], [64, 106, 54], [73, 116, 58], [82, 126, 62]];
const CHALK = rgb(234, 234, 222), DIRT = [138, 106, 74];
const SIX_B = GB + 5.4, AREA_B = GB + 15, SIX_A = 9.5, ARC_R = 6.2;
function chalkAt(a, b) {
  const h = .11, v = .065; // lines across the screen need more width in b, because b is squashed by the camera
  if (Math.abs(b - GB) < h && Math.abs(a) < 15) return true;
  if (Math.abs(b - SIX_B) < h && Math.abs(a) < SIX_A + v) return true;
  if (Math.abs(Math.abs(a) - SIX_A) < v && b > GB && b < SIX_B) return true;
  if (Math.abs(b - AREA_B) < h) return true;
  const r = Math.hypot(a, b - SPOT_B);
  if (r < .26) return true;
  return b > AREA_B && Math.abs(r - ARC_R) < (v * Math.abs(a) + h * Math.abs(b - SPOT_B)) / r;
}
function groundColor(x, y, ix, iy, i) {
  const a = (x - y) / R2, b = (x + y) / R2;
  const edge = Math.pow(Math.pow(Math.abs(a) / 16.2, 4) + Math.pow(Math.abs(b + 2) / 12.6, 4), .25);
  const rough = edge + (noise(a * 1.2, b * 1.2) - .5) * .12;
  if (rough > 1.04) return 0;
  if (rough > .93 && hash(ix, iy) < (rough - .93) / .11) return 0;
  const fine = hash(ix, iy);
  if (b < BOARD_B + .2) { // long grass behind the advertising boards
    kinds[i] = KIND_GRASS;
    const t = noise(a * .9, b * .9) * 1.15 + (fine - .5) * .55 - .08;
    return rgb(...GRASS[clamp(Math.floor(t * 4.2), 0, 3)]);
  }
  if (chalkAt(a, b) && fine > .1) { kinds[i] = KIND_LINE; return CHALK; }
  const spot = Math.hypot(a, (b - SPOT_B) * 1.3);
  const mouth = Math.abs(a) < 3 && b > GB && b < GB + 1.8
    ? noise(a * 1.4, b * 2.2) + (1 - Math.abs(a) / 3) * .45 - (b - GB) / 1.8 * .55 : 0;
  if (mouth > .52 || (spot < 1.2 && noise(a * 2, b * 2) + (1 - spot / 1.2) * .5 > .75)) {
    kinds[i] = KIND_DIRT;
    return rampOf(DIRT)[clamp(Math.floor(1.6 + noise(a * 3, b * 3) * 1.8 + (bayerAt(ix, iy) - .5) * .9), 1, 3)];
  }
  kinds[i] = KIND_PITCH;
  // mowing stripes run across the screen; close tones so the dither never reads as a checkerboard
  const stripe = b > GB ? Math.floor((b - GB) / 2.2) & 1 : 0;
  const v = .42 + (noise(a * .5, b * .6) - .5) * .45 + stripe * .26 + (fine - .5) * .22;
  return rgb(...PITCH[clamp(Math.floor(v * 4 + (bayerAt(ix, iy) - .5) * .6), 0, 3)]);
}

/* ---------- players ---------- */
// A player built from capsules. (fa, fb) is the facing direction on the pitch, (fb, -fa) its side axis.
// roll tips the whole body sideways around the hip, which is how a keeper dives.
function rig(a0, b0, fa, fb, p, pal) {
  const sa = fb, sb = -fa, cr = Math.cos(p.roll || 0), sr = Math.sin(p.roll || 0);
  const leg = (sg, th, kn, sp) => {
    const cs = Math.cos(sp), ss = Math.sin(sp) * sg, hip = [0, sg * .15, 0];
    const knee = [Math.sin(th) * cs * .62, hip[1] + ss * .62, -Math.cos(th) * cs * .62];
    const foot = [knee[0] + Math.sin(th - kn) * cs * .6, knee[1] + ss * .6, knee[2] - Math.cos(th - kn) * cs * .6];
    const toe = [foot[0] + Math.cos(th - kn) * .17, foot[1], foot[2] + Math.sin(th - kn) * .17 - .04];
    return [hip, knee, foot, toe];
  };
  const L = leg(1, p.thL || 0, p.knL ?? .06, p.spL ?? .05), R = leg(-1, p.thR || 0, p.knR ?? .06, p.spR ?? .05);
  const turn = ([f, s, u]) => [f, s * cr + u * sr, -s * sr + u * cr];
  let hs = p.shift || 0, hz;
  if (p.hip) [hs, hz] = p.hip;
  else hz = .1 - Math.min(turn(L[2])[2], turn(R[2])[2]); // stand on the lower foot
  hz += p.z || 0;
  const AB = q => { const [f, s, u] = turn(q); return [a0 + fa * f + sa * (s + hs), b0 + fb * f + sb * (s + hs), hz + u]; };
  const add = (q0, q1, r0, r1, c) => dynamicAdd(W3(...AB(q0)), W3(...AB(q1)), r0, r1, typeof c === 'function' ? c : () => c);
  const shirt = z => (Math.floor(z * 3.2) % 2 ? pal.shirt : pal.stripe); // ~3px hoops: thinner reads as noise
  for (const [hip, knee, foot, toe] of [L, R]) {
    add(hip, knee, .17, .14, pal.shorts);
    add(knee, foot, .13, .1, pal.socks);
    add(foot, toe, .1, .09, BOOT);
  }
  const lean = p.lean || 0, ls = Math.sin(lean), lc = Math.cos(lean);
  const neck = [ls * 1.03, 0, lc * 1.03], head = [ls * 1.32, 0, lc * 1.32];
  add([0, 0, 0], neck, .3, .32, shirt);
  add(neck, head, .11, .12, pal.skin);
  add(head, head, .24, .24, pal.skin);
  const hair = [head[0] - .06, 0, head[2] + .08];
  add(hair, hair, .205, .205, pal.hair);
  const arm = (sg, al, be, bn) => {
    const sh = [ls * .92, sg * .36, lc * .92 - .03];
    const d1 = [Math.sin(al) * Math.cos(be), sg * Math.sin(be), -Math.cos(al) * Math.cos(be)];
    const d2 = [Math.sin(al + bn) * Math.cos(be), sg * Math.sin(be), -Math.cos(al + bn) * Math.cos(be)];
    const el = sh.map((v, k) => v + d1[k] * .46), hand = el.map((v, k) => v + d2[k] * .44);
    add(sh, el, .12, .1, shirt);
    add(el, hand, .09, pal.gloves ? .11 : .08, pal.gloves || pal.skin);
  };
  arm(1, p.alL ?? .05, p.beL ?? .14, p.bnL ?? .15);
  arm(-1, p.alR ?? .05, p.beR ?? .14, p.bnR ?? .15);
}
const norm = (a, b) => { const l = Math.hypot(a, b) || 1; return [a / l, b / l]; };
function idlePose(seed = 0) {
  const breathe = STILL ? 0 : Math.sin(G.time * 1.8 + seed) * .015;
  return { lean: .04 + breathe, alL: .05, beL: .2 + breathe, alR: .05, beR: .2 - breathe };
}
function cheerPose(seed = 0) {
  const hop = STILL ? .2 : Math.abs(Math.sin(G.time * 7 + seed)) * .42;
  return { z: hop, thL: .15, knL: .4, thR: -.1, knR: .3, alL: 0, beL: 2.75, bnL: 0, alR: 0, beR: 2.75, bnR: 0 };
}
const SLUMP = { lean: .78, thL: .38, knL: .72, thR: .38, knR: .72, spL: .14, spR: .14, alL: 1.05, beL: .22, bnL: .2, alR: 1.05, beR: .22, bnR: .2 };

/* ---------- the keeper ---------- */
const READY = { thL: .38, knL: .8, thR: .38, knR: .8, spL: .26, spR: .26, lean: .3, alL: .5, beL: .72, bnL: .4, alR: .5, beR: .72, bnR: .4 };
const K = { dive: null, sway: false, pose: READY, geo: { ha: 0, hz: 1.15, roll: 0, up: 0 } };
function startDive(ta, tz, dur) {
  const center = Math.abs(ta) < .9, reach = 1.85;
  const rollT = center ? 0 : clamp(Math.atan2(ta, Math.max(.3, tz * .9 + .1)), -1.45, 1.45);
  const dA = Math.sin(rollT), dZ = Math.cos(rollT);
  const hT = center
    ? [clamp(ta, -.6, .6), clamp(tz - 1.6, .95, 1.85)]
    : [clamp(ta - dA * reach, -2.7, 2.7), clamp(tz - dZ * reach, .36, 1.6)];
  K.dive = { t: 0, dur, rollT, h0: [K.geo.ha, 1.15], hT, center, armsUp: !center || tz > 1.3, ta };
}
function updateKeeper() {
  const d = K.dive;
  if (!d) {
    const shift = K.sway && !STILL ? Math.sin(G.time * 2.1) * .32 : 0;
    K.pose = { ...READY, shift };
    K.geo = { ha: shift, hz: 1.15, roll: 0, up: 0 };
    return;
  }
  const s = ease(clamp(d.t / d.dur, 0, 1)), fall = ease(clamp((d.t - d.dur) / .3, 0, 1)), side = Math.sign(d.rollT);
  let ha = lerp(d.h0[0], d.hT[0], s), hz = lerp(d.h0[1], d.hT[1], s), roll = d.rollT * s;
  if (d.center) hz = lerp(hz, 1.15, fall);
  else { hz = lerp(hz, .36, fall); roll = lerp(roll, side * 1.52, fall); ha += side * .25 * fall; }
  const up = d.armsUp ? s : 0, armAl = d.armsUp ? 0 : .7, armBe = d.armsUp ? 2.9 : .35;
  K.geo = { ha, hz, roll, up };
  K.pose = {
    hip: [ha, hz], roll, lean: lerp(.3, .05, s),
    thL: lerp(.38, d.center ? .3 : .12, s), knL: lerp(.8, d.center ? .5 : .25, s),
    thR: lerp(.38, d.center ? .3 : .05, s), knR: lerp(.8, d.center ? .5 : .2, s),
    spL: lerp(.26, side < 0 ? .45 : .12, s), spR: lerp(.26, side > 0 ? .45 : .12, s),
    alL: lerp(.5, armAl, s), beL: lerp(.72, armBe, s), bnL: lerp(.4, 0, s),
    alR: lerp(.5, armAl, s), beR: lerp(.72, armBe, s), bnR: lerp(.4, 0, s),
  };
}
function segDist(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, t = clamp(((px - ax) * vx + (pz - az) * vz) / (vx * vx + vz * vz || 1), 0, 1);
  return Math.hypot(px - ax - vx * t, pz - az - vz * t);
}
// the keeper's body as two capsules in the goal plane: head-to-toe axis, and the arm span
function keeperTouches(a, z) {
  const g = K.geo, dA = Math.sin(g.roll), dZ = Math.cos(g.roll), top = 1.3 + .55 * g.up;
  if (segDist(a, z, g.ha - dA * 1.1, g.hz - dZ * 1.1, g.ha + dA * top, g.hz + dZ * top) < .33 + BR) return true;
  const cx = g.ha + dA * .9, cz = g.hz + dZ * .9, w = (1 - g.up) * .95 + .15;
  return segDist(a, z, cx - dZ * w, cz + dA * w, cx + dZ * w, cz - dA * w) < .16 + BR;
}

/* ---------- static scene ---------- */
const BOARD_COLORS = [[196, 64, 48], [236, 226, 200], [52, 92, 140], [236, 190, 60], [64, 128, 84]];
function boards() {
  const seg = 3.2;
  for (let a = -BOARD_A; a <= BOARD_A; a += .045) {
    const k = Math.floor((a + BOARD_A) / seg), c = BOARD_COLORS[k % BOARD_COLORS.length], ramp = rampOf(c);
    const local = a + BOARD_A - k * seg, light = c[0] + c[1] + c[2] > 600;
    for (let z = 0; z <= BOARD_H; z += .045) {
      const p = P3(a, BOARD_B, z), ix = p.sx | 0, iy = p.sy | 0;
      if (ix < 0 || iy < 0 || ix >= W || iy >= H) continue;
      const i = iy * W + ix;
      if (p.d <= zb[i]) continue;
      zb[i] = p.d;
      // a block of pretend lettering in the middle of each panel, in chunks at least 3px wide
      const mark = local > .55 && local < seg - .55 && z > .28 && z < .6 && Math.floor(local * 2.2) % 3 !== 2;
      let level = mark ? (light ? .7 : 3.3) : 2;
      if (z > BOARD_H - .09) level = 3.5;
      if (local < .07) level = .5;
      pix[i] = ramp[clamp(Math.floor(level + (bayerAt(ix, iy) - .5) * .5), 0, 4)];
    }
  }
  for (let a = -BOARD_A; a <= BOARD_A; a += .3) for (const z of [.15, .4, .65, .82]) {
    const [x, y] = toXY(a, BOARD_B);
    castShadow(x, y, z, .28);
  }
}
const NET = [];
function buildNet() {
  const step = .07, mesh = .5, topLen = Math.hypot(ND, GH - BH);
  const push = (a, b, z, plane) => NET.push(a, b, z, plane);
  // the back panel is dotted, so the boards show through and it reads as mesh rather than a fence
  for (let a = -GW / 2 + mesh; a < GW / 2 - 1e-6; a += mesh) for (let z = 0; z <= BH; z += step * 2) push(a, GB - ND, z, 0);
  for (let z = mesh; z <= BH; z += mesh) for (let a = -GW / 2; a <= GW / 2; a += step * 2) push(a, GB - ND, z, 0);
  for (let a = -GW / 2; a <= GW / 2 + 1e-6; a += mesh) for (let w = 0; w <= 1; w += step / topLen) push(a, GB - ND * w, GH + (BH - GH) * w, 1);
  for (let w = mesh / topLen; w < 1; w += mesh / topLen) for (let a = -GW / 2; a <= GW / 2; a += step) push(a, GB - ND * w, GH + (BH - GH) * w, 1);
  for (const s of [-1, 1]) {
    for (let w = 0; w <= 1 + 1e-6; w += mesh / ND) for (let z = 0; z <= GH + (BH - GH) * w; z += step) push(s * GW / 2, GB - ND * w, z, 2);
    for (let z = 0; z <= GH; z += mesh) for (let w = 0; w <= 1; w += step / ND) if (z <= GH + (BH - GH) * w) push(s * GW / 2, GB - ND * w, z, 2);
  }
}

function bake() {
  zb.fill(-1e9);
  pix.fill(rgb(255, 255, 255));
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundColor(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1;
    zb[i] = (g.x + g.y) / R2 * COS;
  }
  growGrass();
  groundZ.set(zb);

  pendingShadows.length = 0;
  const post = () => POST_C, frame = () => FRAME_C;
  for (const s of [-1, 1]) dynamicAdd(W3(s * GW / 2, GB, 0), W3(s * GW / 2, GB, GH), POST_R, POST_R, post);
  dynamicAdd(W3(-GW / 2, GB, GH), W3(GW / 2, GB, GH), POST_R, POST_R, post);
  // the thin back frame the net hangs from
  for (const s of [-1, 1]) {
    dynamicAdd(W3(s * GW / 2, GB - ND, 0), W3(s * GW / 2, GB - ND, BH), .05, .05, frame);
    dynamicAdd(W3(s * GW / 2, GB - ND, BH), W3(s * GW / 2, GB, GH), .05, .05, frame);
  }
  dynamicAdd(W3(-GW / 2, GB - ND, BH), W3(GW / 2, GB - ND, BH), .05, .05, frame);
  // water bottles by the far keeper
  const bottles = [[13.6, GB + 1.6, [70, 120, 170]], [13.9, GB + 1.9, [70, 120, 170]], [13.4, GB + 2.1, [220, 220, 210]]];
  for (const [a, b, c] of bottles) {
    capsule(W3(a, b, .1), W3(a, b, .5), .12, .1, () => c, 'gloss');
    castShadow(...toXY(a, b), .3, .14);
  }
  boards();
  growTree(...toXY(-13.6, -14.4), 1, 420, 0);
  growTree(...toXY(13.4, -14.2), .9, 380, 900);
  flushShadows();
  bakeOcclusion();
  staticShadow.set(shadowMask);
  applyShadows(groundZ);
  bakedPix.set(pix);
  bakedZ.set(zb);
}

/* ---------- match state ---------- */
const G = {
  phase: 'aim', shooter: 0, shots: [[], []], time: 0, timer: 0, flightT: 0,
  aim: { a: 0, z: 1.4 }, power: 0, charging: false, plan: null, keeperPlan: null, kicked: false,
  ball: null, outcome: null, cheer: -1, tell: 0, earlyDive: false, status: '',
  net: { a: 0, z: 0, t: -99, amp: 0 }, keys: new Set(),
};
const KK = { active: false, t: 0 };
const nodes = {
  s: [document.getElementById('s0'), document.getElementById('s1')],
  d: [document.getElementById('d0'), document.getElementById('d1')],
  status: document.getElementById('status'),
};
const goals = () => G.shots.map(s => s.filter(Boolean).length);
function renderHud() {
  const n = Math.max(5, G.shots[0].length, G.shots[1].length), g = goals();
  for (let t = 0; t < 2; t++) {
    nodes.s[t].textContent = g[t];

<script type="module">
// Effects from pixelfx (https://github.com/patch-gg/pixelfx, MIT). They draw into their own color + light
// buffers, which are composited over the game's pixels just before the frame goes to the canvas.
import { createFrame, clearFrame, createFx, composite } from '../vendor/pixelfx/core/index.js';
import * as confetti from '../vendor/pixelfx/fx/ui/confetti.js';

const frame = createFrame(W, H), live = [];
let last = null;
window.PPFX = {
  // the effect's two poppers sit 74px either side of its origin: just outside the posts
  confetti(x, y) {
    live.push(createFx(confetti, { x: Math.round(x), y: Math.round(y), seed: Math.random() * 1e6 | 0, light: .45 }));
  },
  draw(time) {
    const dt = last === null ? 0 : Math.min(.05, Math.max(0, time - last));
    last = time;
    if (!live.length) return;
    clearFrame(frame);
    for (const fx of live) { fx.update(dt); fx.draw(frame); }
    composite(frame, image.data, pix); // pix aliases image.data; composite reads each pixel before writing it
    for (let i = live.length - 1; i >= 0; i--) if (live[i].done()) live.splice(i, 1);
  },
};
</script>
